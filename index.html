<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시연 목록</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --ink: #1a1c1f;
            --soft: #8b9098;
            --line: #ececec;
            --accent: #FF5154;
            --bg: #fbfbfa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: clamp(48px, 12vh, 140px) 24px;
        }

        .wrap {
            width: 100%;
            max-width: 560px;
        }

        header {
            margin-bottom: 44px;
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 15px;
            color: var(--soft);
            font-weight: 500;
        }

        ul {
            list-style: none;
            border-top: 1px solid var(--line);
        }

        li {
            border-bottom: 1px solid var(--line);
        }

        li a {
            display: flex;
            align-items: baseline;
            gap: 14px;
            padding: 18px 4px;
            text-decoration: none;
            color: var(--ink);
            transition: color 0.2s ease, padding-left 0.2s ease;
        }

        li a:hover {
            color: var(--accent);
            padding-left: 10px;
        }

        li a .idx {
            font-size: 13px;
            font-weight: 600;
            color: var(--soft);
            min-width: 26px;
            font-variant-numeric: tabular-nums;
        }

        li a:hover .idx { color: var(--accent); }

        li a .label {
            font-size: 17px;
            font-weight: 600;
            flex: 1;
        }

        li a .arrow {
            font-size: 15px;
            color: var(--soft);
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        li a:hover .arrow {
            opacity: 1;
            color: var(--accent);
            transform: translateX(2px);
        }

        footer {
            margin-top: 40px;
            font-size: 13px;
            color: var(--soft);
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>시연 목록</h1>
            <p class="subtitle">HTML 데모 모음</p>
        </header>

        <ul>
            <li>
                <a href="시내출장변경취소.html" target="_blank">
                    <span class="idx">01</span>
                    <span class="label">시내 출장 변경/취소 양식</span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <span class="idx">02</span>
                    <span class="label">두 번째 데모</span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
        </ul>

        <footer>&copy; 2026</footer>
    </div>
</body>
</html>
